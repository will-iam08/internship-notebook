<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A private notebook for internship applications, interviews, deadlines, and offers. Works offline and installs like an app." />
    <meta name="theme-color" content="#f3eee4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Notebook" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>My Internship Notebook</title>
    <!-- Canonical: this app is also mirrored on Render (see README); this points searches and
         social previews at one address instead of splitting signal across both. Update this
         (and og:url below) together if a custom domain is added, or if Render should be primary
         instead. -->
    <link rel="canonical" href="https://will-iam08.github.io/coop-compass/" />
    <link rel="icon" href="favicon-20260915-v4.ico" type="image/x-icon" sizes="32x32" />
    <link rel="icon" href="favicon-20260915-v4.png" type="image/png" sizes="32x32" />
    <link rel="shortcut icon" href="favicon-20260915-v4.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Open Graph / social share previews (Slack, iMessage, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="My Internship Notebook" />
    <meta property="og:title" content="My Internship Notebook" />
    <meta property="og:description" content="A private notebook for internship applications, interviews, deadlines, and offers. Works offline and installs like an app." />
    <meta property="og:url" content="https://will-iam08.github.io/coop-compass/" />
    <meta property="og:image" content="https://will-iam08.github.io/coop-compass/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="My Internship Notebook logo: a notebook with a bookmark, on a dark blue cover" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="My Internship Notebook" />
    <meta name="twitter:description" content="A private notebook for internship applications, interviews, deadlines, and offers. Works offline and installs like an app." />
    <meta name="twitter:image" content="https://will-iam08.github.io/coop-compass/icon-512.png" />
    <!-- Structured data: this is a free web app with no accounts, storefront, or physical
         location, so WebApplication is the accurate schema.org type. It is deliberately not
         marked up as a LocalBusiness (no address, hours, or phone number exist to be accurate
         about) or an Organization (there is no company behind it) - a false business listing
         would be misleading, not helpful, structured data. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "My Internship Notebook",
        "url": "https://will-iam08.github.io/coop-compass/",
        "description": "A private notebook for internship applications, interviews, deadlines, and offers. Works offline and installs like an app.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any (runs in a web browser)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "isAccessibleForFree": true
      }
    </script>
    <script>
      // Apply the saved theme before the first paint so dark mode never flashes white.
      (() => {
        let theme = null;
        try { theme = localStorage.getItem("my-internship-notebook-theme"); } catch { /* private windows */ }
        if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <div class="app" id="app">
      <aside class="cover" aria-label="Notebook">
        <a class="cover-label" href="#/today" aria-label="My Internship Notebook, go to Today">
          <span class="cover-logo" aria-hidden="true"></span>
          <span class="cover-title">My Internship<br />Notebook</span>
          <span class="cover-sub">Applications &amp; interviews</span>
        </a>

        <div class="cover-actions">
          <button class="button primary cover-new" type="button" data-action="new">
            <span data-icon="plus"></span> New application <kbd>N</kbd>
          </button>
          <button class="cover-search" type="button" data-action="palette" aria-keyshortcuts="Control+K Meta+K /">
            <span data-icon="search"></span><span>Search</span><kbd class="shortcut-key">⌘K</kbd>
          </button>
        </div>

        <nav class="tabs" aria-label="Sections">
          <a class="tab" href="#/today" data-nav="today" style="--tab: var(--tab-today)"><span data-icon="today"></span><span>Today</span></a>
          <a class="tab" href="#/board" data-nav="board" style="--tab: var(--tab-board)"><span data-icon="board"></span><span>Board</span><b class="tab-count" data-count="active"></b></a>
          <a class="tab" href="#/notebook" data-nav="notebook" style="--tab: var(--tab-notebook)"><span data-icon="notebook"></span><span>All pages</span><b class="tab-count" data-count="total"></b></a>
          <a class="tab" href="#/insights" data-nav="insights" style="--tab: var(--tab-insights)"><span data-icon="insights"></span><span>Insights</span></a>
          <span class="tab-divider" role="presentation"></span>
          <a class="tab" href="#/deleted" data-nav="deleted" style="--tab: var(--tab-deleted)"><span data-icon="trash"></span><span>Recently Deleted</span><b class="tab-count" data-count="deleted"></b></a>
          <a class="tab" href="#/settings" data-nav="settings" style="--tab: var(--tab-settings)"><span data-icon="settings"></span><span>Settings</span></a>
        </nav>

        <div class="cover-footer">
          <p class="storage-chip" data-storage-chip><span data-icon="lock"></span><span data-storage-label>Private to this browser</span></p>
          <button class="icon-button cover-theme" type="button" data-action="cycle-theme" aria-label="Change theme" title="Change theme"><span data-theme-icon></span></button>
        </div>
      </aside>

      <div class="page-wrap">
        <div class="binding" aria-hidden="true"></div>
        <header class="mobile-bar">
          <a class="mobile-brand" href="#/today" aria-label="Today"><span class="cover-logo small" aria-hidden="true"></span></a>
          <p class="mobile-title" id="mobile-title">Today</p>
          <button class="icon-button" type="button" data-action="palette" aria-label="Search"><span data-icon="search"></span></button>
          <a class="icon-button" href="#/settings" aria-label="Settings"><span data-icon="settings"></span></a>
        </header>
        <main class="page" id="page">
          <div class="view" id="view" tabindex="-1"></div>
        </main>
      </div>

      <nav class="bottom-tabs" aria-label="Sections">
        <a href="#/today" data-nav="today"><span data-icon="today"></span><span>Today</span></a>
        <a href="#/board" data-nav="board"><span data-icon="board"></span><span>Board</span></a>
        <button class="bottom-new" type="button" data-action="new" aria-label="New application"><span data-icon="plus"></span></button>
        <a href="#/notebook" data-nav="notebook"><span data-icon="notebook"></span><span>Pages</span></a>
        <a href="#/insights" data-nav="insights"><span data-icon="insights"></span><span>Insights</span></a>
      </nav>
    </div>

    <div class="selection-bar" id="selection-bar" role="toolbar" aria-label="Selected applications" hidden></div>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <div class="chart-tip" id="chart-tip" role="tooltip" hidden></div>
    <div class="menu" id="menu" role="menu" hidden></div>

    <dialog class="sheet" id="new-dialog" aria-labelledby="new-title">
      <form class="sheet-card" id="new-form" method="dialog" novalidate>
        <header class="sheet-head">
          <div>
            <p class="eyebrow">New page</p>
            <h2 id="new-title">Add an application</h2>
          </div>
          <button class="icon-button" type="button" data-action="close-new" aria-label="Close"><span data-icon="x"></span></button>
        </header>
        <div class="sheet-body">
          <div class="field-grid">
            <label class="field span-2"><span class="field-label">Company <span class="req" aria-hidden="true">*</span></span>
              <input required maxlength="80" name="company" autocomplete="organization" placeholder="e.g. Shopify" />
            </label>
            <label class="field span-2"><span class="field-label">Role <span class="req" aria-hidden="true">*</span></span>
              <input required maxlength="100" name="role" autocomplete="off" placeholder="e.g. Backend Developer Intern" />
            </label>
            <fieldset class="field span-2 stage-field">
              <legend>Stage</legend>
              <div class="stage-picker" id="new-stage"></div>
            </fieldset>
          </div>
          <details class="more-fields">
            <summary>More details <span class="muted">(optional)</span></summary>
            <div class="field-grid" style="margin-top: 14px">
              <label class="field">Deadline
                <input name="deadline" type="date" />
              </label>
              <label class="field">Location
                <input maxlength="80" name="location" placeholder="Toronto or Remote" />
              </label>
              <label class="field">Where you found it
                <input maxlength="60" name="source" list="source-options" placeholder="LinkedIn, WaterlooWorks…" />
              </label>
              <label class="field">Job posting link
                <input maxlength="500" name="link" type="url" inputmode="url" placeholder="https://…" />
              </label>
              <label class="field span-2">Skills
                <input maxlength="250" name="skills" placeholder="Java, React, SQL" />
                <small>Separate skills with commas.</small>
              </label>
              <label class="field span-2">Notes
                <textarea maxlength="10000" name="notes" rows="3" placeholder="Why this role? Anything to remember?"></textarea>
              </label>
            </div>
          </details>
          <p class="form-error" id="new-error" role="alert" hidden></p>
        </div>
        <footer class="sheet-foot">
          <button class="button ghost" type="button" data-action="close-new">Cancel</button>
          <button class="button primary" type="submit">Add to notebook</button>
        </footer>
      </form>
    </dialog>
    <datalist id="source-options"></datalist>

    <dialog class="confirm" id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-copy">
      <div class="confirm-card">
        <div class="confirm-mark" id="confirm-mark" aria-hidden="true"></div>
        <p class="eyebrow" id="confirm-eyebrow">A small safety net</p>
        <h2 id="confirm-title">Are you sure?</h2>
        <p id="confirm-copy"></p>
        <div class="confirm-actions">
          <button class="button ghost" type="button" data-confirm="no" id="confirm-no">Keep it</button>
          <button class="button danger" type="button" data-confirm="yes" id="confirm-yes">Continue</button>
        </div>
      </div>
    </dialog>

    <dialog class="palette" id="palette" aria-label="Search your notebook">
      <div class="palette-card">
        <label class="palette-input"><span data-icon="search"></span>
          <span class="sr-only">Search</span>
          <input id="palette-input" type="search" placeholder="Search companies, roles, skills, notes…" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="palette-results" aria-autocomplete="list" />
          <kbd>Esc</kbd>
        </label>
        <ul class="palette-results" id="palette-results" role="listbox"></ul>
      </div>
    </dialog>

    <input type="file" id="import-file" accept="application/json,.json" hidden />
    <script src="site-mode.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
